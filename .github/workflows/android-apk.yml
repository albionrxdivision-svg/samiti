name: Build Ekota Samiti Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Create Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Google Services & Env
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Notice: app/google-services.json not found in repo; generating CI config for com.aistudio.ekotasamiti.jxqp"
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ekota-samiti-ci-placeholder"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.ekotasamiti.jxqp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-ciplaceholderwebclientid.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "CI_PLACEHOLDER_API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "000000000000-ciplaceholderwebclientid.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: |
          APP_VER_CODE=$((GITHUB_RUN_NUMBER + 10))
          APP_VER_NAME="1.0.${GITHUB_RUN_NUMBER}"
          gradle --no-daemon --no-build-cache \
            -PappVersionCode="$APP_VER_CODE" \
            -PappVersionName="$APP_VER_NAME" \
            -PgithubRepoSlug="${{ github.repository }}" \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ekota-Samiti-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" Ekota-Samiti.apk
            TAG="v1.0.${{ github.run_number }}"
            gh release create "$TAG" Ekota-Samiti.apk \
              --title "Ekota Samiti $TAG" \
              --notes "Version Code $((GITHUB_RUN_NUMBER + 10)) — Direct in-place update without uninstalling."
          fi
